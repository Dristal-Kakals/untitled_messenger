[package]
name = "um_gui"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "um_gui"
path = "src/lib.rs"

[[bin]]
name = "um-gui"
path = "src/main.rs"

[dependencies]
um_client = { path = "../client" }
um_protocol = { path = "../protocol" }
um_crypto = { path = "../crypto" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
thiserror = "2"
sha2 = "0.11"
postcard = { version = "1", features = ["alloc"] }

[dev-dependencies]
um_server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "test-util"] }
iced_tiny_skia = "0.14"
iced_graphics = "0.14"
