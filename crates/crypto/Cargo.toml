[package]
name = "um_crypto"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
curve25519-dalek = { version = "4", features = ["digest"] }
chacha20poly1305 = { version = "0.11", features = ["alloc", "getrandom"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
# Post-quantum hybrid: ML-KEM-768 (FIPS 203, pure Rust). Used as a KEM layer
# over X3DH so the session root key is bound to a lattice secret in addition to
# the classical X25519 DH outputs. `getrandom` pulls OS RNG for keygen/encaps.
ml-kem = { version = "0.3", features = ["getrandom"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
